    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 80px;
            overflow-x: hidden;
        }

        /* App Header */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-color);
        }

        .brand-title {
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Search Bar */
        .search-box {
            margin: 16px 20px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 45px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }
    </style>
</head>

        <style>
        /* Main Container & Section Layout */
        .container {
            padding: 0 20px;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin: 24px 0 12px 0;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Platform Grid Layout */
        .platform-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
            gap: 14px;
        }

        /* Individual Platform Cards */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .card:active {
            transform: scale(0.95);
        }

        .card:hover {
            border-color: var(--accent-color);
            box-shadow: var(--shadow);
        }

        .card-img-wrapper {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            padding: 2px;
        }

        .card-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .card-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.2;
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .badge-new {

            top: 6px;
            right: 6px;
            background: #ef4444;
            color: #ffffff;
            font-size: 0.55rem;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        /* Navigation Bottom Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: rgba(15, 23, 42, 0.98);

            font-size: 0.7rem;

            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-color);
        }

        .nav-item i {
            font-size: 1.2rem;
        }

        <script>
        // Sorting Logic: Sorts platforms within each section by priority
        function getSortedPlatformsBySection(sectionName) {
            return platformsData
                .filter(item => item.section === sectionName)
                .sort((a, b) => a.priority - b.priority);
        }

        // HTML Generator for Individual Platform Cards
        function createCardHTML(platform) {
            return `
                <div class="card" onclick="openPlatform('${platform.link}', '${platform.name}')">
                    ${platform.badge ? `<span class="badge-new">${platform.badge}</span>` : ''}
                    <div class="card-img-wrapper">
                        <img src="${platform.logo}" alt="${platform.name}" class="card-img" onerror="this.src='https://i.ibb.co/MxKgrYny/Careerwill.jpg'">
                    </div>
                    <div class="card-title">${platform.name}</div>
                </div>
            `;
        }

        // Core Rendering Engine: Populate grids dynamically
        function renderAllSections() {
            const pwContainer = document.getElementById('pwSection');
            const kgsContainer = document.getElementById('kgsSection');
            const schoolContainer = document.getElementById('schoolSection');
            const compContainer = document.getElementById('compSection');

            if (pwContainer) {
                pwContainer.innerHTML = getSortedPlatformsBySection('pw')
                    .map(createCardHTML)
                    .join('');
            }

            if (kgsContainer) {
                kgsContainer.innerHTML = getSortedPlatformsBySection('kgs')
                    .map(createCardHTML)
                    .join('');
            }

            if (schoolContainer) {
                schoolContainer.innerHTML = getSortedPlatformsBySection('school')
                    .map(createCardHTML)
                    .join('');
            }

            if (compContainer) {
                compContainer.innerHTML = getSortedPlatformsBySection('comp')
                    .map(createCardHTML)
                    .join('');
            }
        }
    </script>
    
        <script>
        // Open Platform in Modal Viewer or External Tab
        function openPlatform(url, title) {
            vibratePhone();
            
            const modal = document.getElementById('webviewModal');
            const iframe = document.getElementById('platformIFrame');
            const modalTitle = document.getElementById('modalTitle');

            if (!modal || !iframe) return;

            // Set Title & Source URL
            modalTitle.innerText = title || "Loading...";
            iframe.src = url;

            // Display Modal with Flex Layout
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Lock background scroll
        }

        // Close WebView Modal
        function closeWebView() {
            const modal = document.getElementById('webviewModal');
            const iframe = document.getElementById('platformIFrame');

            if (modal) {
                modal.style.display = 'none';
            }
            if (iframe) {
                iframe.src = 'about:blank'; // Clear memory/state
            }

            document.body.style.overflow = 'auto'; // Restore background scroll
        }

        // Reload current active WebView
        function reloadWebView() {
            const iframe = document.getElementById('platformIFrame');
            if (iframe && iframe.src !== 'about:blank') {
                iframe.src = iframe.src;
            }
        }
    </script>
    
        <script>
        // Real-time Search Engine Across All Sections
        function filterPlatforms() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const allCards = document.querySelectorAll('.card');

            allCards.forEach(card => {
                const titleText = card.querySelector('.card-title').innerText.toLowerCase();
                const badgeText = card.querySelector('.badge-new') ? card.querySelector('.badge-new').innerText.toLowerCase() : '';

                if (titleText.includes(query) || badgeText.includes(query)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });

            // Auto-hide Section Headers if no visible cards remain in that section
            const sections = ['pwSection', 'kgsSection', 'schoolSection', 'compSection'];
            sections.forEach(secId => {
                const secGrid = document.getElementById(secId);
                if (secGrid) {
                    const visibleCards = secGrid.querySelectorAll('.card[style*="display: flex"]');
                    const titleHeader = secGrid.previousElementSibling;
                    
                    if (query !== "" && visibleCards.length === 0) {
                        if (titleHeader && titleHeader.classList.contains('section-title')) {
                            titleHeader.style.display = 'none';
                        }
                    } else {
                        if (titleHeader && titleHeader.classList.contains('section-title')) {
                            titleHeader.style.display = 'flex';
                        }
                    }
                }
            });
        }
    </script>
    
        <script>
        // Category Filter Functionality for Bottom Navigation / Quick Toggles
        function filterCategory(category) {
            const sections = [
                { id: 'pwSection', cat: 'pw' },
                { id: 'kgsSection', cat: 'kgs' },
                { id: 'schoolSection', cat: 'school' },
                { id: 'compSection', cat: 'comp' }
            ];

            sections.forEach(sec => {
                const grid = document.getElementById(sec.id);
                const titleHeader = grid ? grid.previousElementSibling : null;

                if (category === 'all' || sec.cat === category) {
                    if (grid) grid.style.display = 'grid';
                    if (titleHeader && titleHeader.classList.contains('section-title')) {
                        titleHeader.style.display = 'flex';
                    }
                } else {
                    if (grid) grid.style.display = 'none';
                    if (titleHeader && titleHeader.classList.contains('section-title')) {
                        titleHeader.style.display = 'none';
                    }
                }
            });

            // Reset Search Input on category switch
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.value = '';
                filterPlatforms();
            }
        }
    </script>
    
        <script>
        // Native Android Integration Bridge
        const AndroidBridge = {
            // Check if App is running inside Android WebView Container
            isNativeApp: function() {
                return (typeof Android !== "undefined" && window.Android);
            },

            // Trigger Device Vibration via Native Bridge or Web API
            vibrate: function(milliseconds) {
                if (this.isNativeApp() && typeof Android.vibrate === "function") {
                    Android.vibrate(milliseconds || 40);
                } else if (navigator.vibrate) {
                    navigator.vibrate(milliseconds || 40);
                }
            },

            // Send custom event logging to Android native code
            logEvent: function(eventName, payload) {
                if (this.isNativeApp() && typeof Android.logEvent === "function") {
                    Android.logEvent(eventName, JSON.stringify(payload || {}));
                }
            },

            // Request Native Android Toast Notification
            showToast: function(message) {
                if (this.isNativeApp() && typeof Android.showToast === "function") {
                    Android.showToast(message);
                } else {
                    alert(message);
                }
            }
        };

        // Override default vibration with unified bridge function
        function vibratePhone() {
            AndroidBridge.vibrate(40);
        }
    </script>
    
        <script>
        // Network Status Management & Offline Handling
        function initNetworkMonitor() {
            window.addEventListener('online', updateOnlineStatus);
            window.addEventListener('offline', updateOnlineStatus);
        }

        function updateOnlineStatus() {
            const isOnline = navigator.onLine;
            let offlineBanner = document.getElementById('offlineBanner');

            if (!isOnline) {
                if (!offlineBanner) {
                    offlineBanner = document.createElement('div');
                    offlineBanner.id = 'offlineBanner';
                    offlineBanner.style.cssText = `
                        position: fixed;
                        top: 0;
                        left: 0;
                        right: 0;
                        background: #ef4444;
                        color: #ffffff;
                        text-align: center;
                        padding: 8px 12px;
                        font-size: 0.8rem;
                        font-weight: 600;
                        z-index: 2000;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        gap: 8px;
                    `;
                    offlineBanner.innerHTML = `<i class="fa-solid fa-wifi"></i> No Internet Connection. Check network!`;
                    document.body.prepend(offlineBanner);
                }
            } else {
                if (offlineBanner) {
                    offlineBanner.remove();
                }
            }
        }

        // Image Load Error Handler
        function handleImageError(imgElement) {
            imgElement.onerror = null;
            imgElement.src = 'https://i.ibb.co/MxKgrYny/Careerwill.jpg';
        }
    </script>
    
        <script>
        // DOM Initialization & Bootstrapper Sequence
        document.addEventListener('DOMContentLoaded', function() {
            // 1. Render all registered platform cards dynamically
            renderAllSections();

            // 2. Initialize Network Monitoring Engine
            initNetworkMonitor();

            // 3. Log Application Startup
            AndroidBridge.logEvent('app_launched', { timestamp: Date.now() });
        });

        // Hardware Back Button Handling for Android WebViews
        window.addEventListener('popstate', function(event) {
            const modal = document.getElementById('webviewModal');
            if (modal && modal.style.display === 'flex') {
                closeWebView();
                // Prevent navigating back out of the page if modal was open
                history.pushState(null, null, window.location.href);
            }
        });

        // Initialize history state on load for back-button capturing
        history.pushState(null, null, window.location.href);
    </script>
    
        <!-- Global Script Cleanup & Closing -->
    <script>
        // Final Execution Check & Fallback Trigger
        (function verifyInitialization() {
            // Verify if cards are populated, fallback to re-render if needed
            const renderedCards = document.querySelectorAll('.card');
            if (renderedCards.length === 0) {
                console.warn('Re-executing platform render sequence...');
                renderAllSections();
            }
        })();
    </script>
