<!DOCTYPE html>

<head>

    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 80px;
            overflow-x: hidden;
        }

        /* App Header */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-color);
        }

        .brand-title {
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Search Bar */
        .search-box {
            margin: 16px 20px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 45px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .container {
            padding: 0 20px;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin: 24px 0 12px 0;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Platform Card Grid Layout */
        .platform-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
            gap: 14px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .card:active {
            transform: scale(0.95);
        }

        .card:hover {
            border-color: var(--accent-color);
        }

        .card-img-wrapper {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }

        .card-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .card-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.2;
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .badge-new {
            position: absolute;
            top: 6px;
            right: 6px;
            background: #ef4444;
            color: #ffffff;
            font-size: 0.55rem;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        /* Bottom Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
            font-size: 0.7rem;
            text-decoration: none;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-color);
        }

        .nav-item i {
            font-size: 1.2rem;
        }

        /* Modal Screen */
        #webviewModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            flex-direction: column;
        }
    </style>
</head>

        <script>
        // Sort Platforms by Priority Order
        function getSortedPlatformsBySection(sectionName) {
            return platformsData
                .filter(item => item.section === sectionName)
                .sort((a, b) => a.priority - b.priority);
        }

        // HTML Generator for Platform Cards
        function createCardHTML(platform) {
            return `
                <div class="card" onclick="openPlatform('${platform.link}', '${platform.name}')">
                    ${platform.badge ? `<span class="badge-new">${platform.badge}</span>` : ''}
                    <div class="card-img-wrapper">
                        <img src="${platform.logo}" alt="${platform.name}" class="card-img" onerror="this.src='https://i.ibb.co/MxKgrYny/Careerwill.jpg'">
                    </div>
                    <div class="card-title">${platform.name}</div>
                </div>
            `;
        }

        // Render Cards into Respective Grids
        function renderAllSections() {
            const pwContainer = document.getElementById('pwSection');
            const kgsContainer = document.getElementById('kgsSection');
            const schoolContainer = document.getElementById('schoolSection');
            const compContainer = document.getElementById('compSection');

            if (pwContainer) {
                pwContainer.innerHTML = getSortedPlatformsBySection('pw')
                    .map(createCardHTML)
                    .join('');
            }

            if (kgsContainer) {
                kgsContainer.innerHTML = getSortedPlatformsBySection('kgs')
                    .map(createCardHTML)
                    .join('');
            }

            if (schoolContainer) {
                schoolContainer.innerHTML = getSortedPlatformsBySection('school')
                    .map(createCardHTML)
                    .join('');
            }

            if (compContainer) {
                compContainer.innerHTML = getSortedPlatformsBySection('comp')
                    .map(createCardHTML)
                    .join('');
            }
        }
    </script>
    
        <script>
        // Haptic Feedback Trigger
        function vibratePhone() {
            if (navigator.vibrate) {
                navigator.vibrate(40);
            }
        }

        // Scroll to Top Smoothly
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // External Link Handlers
        function openTelegramChannel() {
            window.open('https://t.me/satyaallpremiumbaches', '_blank');
        }

        // WebView Modal Operations
        function openPlatform(url, title) {
            vibratePhone();
            const modal = document.getElementById('webviewModal');
            const iframe = document.getElementById('platformIFrame');
            const modalTitle = document.getElementById('modalTitle');

            if (modal && iframe && modalTitle) {
                modalTitle.innerText = title || "Loading...";
                iframe.src = url;
                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden';
            }
        }

        function closeWebView() {
            const modal = document.getElementById('webviewModal');
            const iframe = document.getElementById('platformIFrame');

            if (modal) {
                modal.style.display = 'none';
            }
            if (iframe) {
                iframe.src = 'about:blank';
            }
            document.body.style.overflow = 'auto';
        }

        function reloadWebView() {
            const iframe = document.getElementById('platformIFrame');
            if (iframe && iframe.src !== 'about:blank') {
                iframe.src = iframe.src;
            }
        }

        // Search & Filter System
        function filterPlatforms() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const allCards = document.querySelectorAll('.card');

            allCards.forEach(card => {
                const titleText = card.querySelector('.card-title').innerText.toLowerCase();
                const badgeElement = card.querySelector('.badge-new');
                const badgeText = badgeElement ? badgeElement.innerText.toLowerCase() : '';

                if (titleText.includes(query) || badgeText.includes(query)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Category Section Filter
        function filterCategory(category) {
            const sections = [
                { id: 'pwSection', key: 'pw' },
                { id: 'kgsSection', key: 'kgs' },
                { id: 'schoolSection', key: 'school' },
                { id: 'compSection', key: 'comp' }
            ];

            sections.forEach(sec => {
                const grid = document.getElementById(sec.id);
                const titleHeader = grid ? grid.previousElementSibling : null;

                if (category === 'all' || sec.key === category) {
                    if (grid) grid.style.display = 'grid';
                    if (titleHeader && titleHeader.classList.contains('section-title')) {
                        titleHeader.style.display = 'flex';
                    }
                } else {
                    if (grid) grid.style.display = 'none';
                    if (titleHeader && titleHeader.classList.contains('section-title')) {
                        titleHeader.style.display = 'none';
                    }
                }
            });
        }
    </script>
    
        <script>
        // DOM Readiness Initialization
        document.addEventListener('DOMContentLoaded', function() {
            // Render all platform cards dynamically
            renderAllSections();
        });

        // Hardware Back Button Handler for Mobile WebView Containers
        window.addEventListener('popstate', function(event) {
            const modal = document.getElementById('webviewModal');
            if (modal && modal.style.display === 'flex') {
                closeWebView();
                // Prevent exiting the app when closing modal
                history.pushState(null, null, window.location.href);
            }
        });

        // Push initial state to trap back button for modal closing
        history.pushState(null, null, window.location.href);
    </script>
