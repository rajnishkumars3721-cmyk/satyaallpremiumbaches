<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rajnish Prime - Link Locked</title>
  
  <meta name="theme-color" content="#080c14">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #080c14;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px 16px;
      overflow-y: auto;
    }

    .landing-logo {
      width: 90px;
      height: 90px;
      border-radius: 20px;
      object-fit: cover;
      border: 3.5px solid #00d2ff;
      box-shadow: 0 0 35px rgba(0, 210, 255, 0.65);
      margin-bottom: 12px;
      animation: pulseGlow 2s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.98); box-shadow: 0 0 25px rgba(0, 210, 255, 0.5); }
      50% { transform: scale(1.03); box-shadow: 0 0 45px rgba(0, 210, 255, 0.85); }
      100% { transform: scale(0.98); box-shadow: 0 0 25px rgba(0, 210, 255, 0.5); }
    }

    .landing-content {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .landing-title {
      font-family: 'Syne', sans-serif;
      font-size: 26px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: 2px;
      margin-bottom: 16px;
      color: #ffffff;
    }

    .task-locker-card {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 18px 16px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      margin-bottom: 16px;
    }

    .task-locker-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .task-locker-desc {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 14px;
    }

    .task-btn {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .task-btn-yt { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); }
    .task-btn-wa { background: linear-gradient(135deg, #22c55e 0%, #15803d 100%); }
    .task-btn-tg { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); }
    .task-btn-ig { background: linear-gradient(135deg, #e1306c 0%, #c13584 100%); }

    .task-btn.completed {
      background: #1f2937 !important;
      color: #34d399 !important;
      border: 1px solid #34d399;
      pointer-events: none;
    }

    .status-msg {
      font-size: 12px;
      margin-top: 10px;
      font-weight: 700;
      padding: 10px;
      border-radius: 8px;
      display: none;
      color: #34d399;
      background: rgba(52, 211, 153, 0.15);
    }

    .reset-link {
      font-size: 11px;
      color: #64748b;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 12px;
      display: inline-block;
    }

    .btn-open-now {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      padding: 15px 30px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(139, 92, 246, 0.6);
      width: 100%;
      display: none;
      animation: pulseGlowBtn 1.5s infinite ease-in-out;
      text-decoration: none;
    }

    @keyframes pulseGlowBtn {
      0% { transform: scale(1); box-shadow: 0 0 20px rgba(139, 92, 246, 0.5); }
      50% { transform: scale(1.03); box-shadow: 0 0 35px rgba(139, 92, 246, 0.8); }
      100% { transform: scale(1); box-shadow: 0 0 20px rgba(139, 92, 246, 0.5); }
    }
  </style>
</head>
<body>

  <img src="https://i.ibb.co/nNkyYLHM/Chat-GPT-Image-Aug-12-2026-08-08-06-AM.png" alt="Rajnish Prime Logo" class="landing-logo">
  
  <div class="landing-content">
    <h1 class="landing-title">RAJNISH<br>PRIME</h1>

    <div class="task-locker-card">
      <div class="task-locker-title">🔒 Link Locked</div>
      <p class="task-locker-desc">Complete all steps below to unlock destination link.</p>

      <a href="https://www.youtube.com/@Rajnishstudyshorts" target="_blank" id="btn-yt" class="task-btn task-btn-yt" onclick="completeTask('yt')">
        <span>📺 Subscribe YouTube</span>
        <span id="status-yt">➔</span>
      </a>

      <a href="https://whatsapp.com/channel/0029VbDI4yFK5cDHjEHcNk16" target="_blank" id="btn-wa" class="task-btn task-btn-wa" onclick="completeTask('wa')">
        <span>📢 Join WhatsApp Channel</span>
        <span id="status-wa">➔</span>
      </a>

      <a href="https://t.me/+cL3-XYVYH6VkYmNl" target="_blank" id="btn-tg" class="task-btn task-btn-tg" onclick="completeTask('tg')">
        <span>✈️ Join Telegram Channel</span>
        <span id="status-tg">➔</span>
      </a>

      <a href="https://www.instagram.com/all_cousre_1?stkn=MTk0djQwbWtibGFm" target="_blank" id="btn-ig" class="task-btn task-btn-ig" onclick="completeTask('ig')">
        <span>📸 Follow on Instagram</span>
        <span id="status-ig">➔</span>
      </a>

      <div class="status-msg" id="statusMsg">🎉 All tasks completed! You can open your batch now.</div>

      <div>
        <span class="reset-link" onclick="resetTaskProgress()">Reset Progress</span>
      </div>
    </div>

    <!-- Final Destination Button (Only opens main.html when clicked) -->
    <a href="./main.html" class="btn-open-now" id="btn-open-now" onclick="openBatch(event)">🔥 Open Your Batch Now 🔥</a>
  </div>

  <script>
    const tasks = ['yt', 'wa', 'tg', 'ig'];

    // Check status when page loads
    checkTaskStatus();

    function completeTask(taskType) {
      vibratePhone(40);
      localStorage.setItem(`task_${taskType}`, 'done');
      
      // Give a tiny delay so the external app opens smoothly
      setTimeout(() => {
        checkTaskStatus();
      }, 500);
    }

    function checkTaskStatus() {
      let completedCount = 0;
      
      tasks.forEach(task => {
        if (localStorage.getItem(`task_${task}`) === 'done') {
          const btn = document.getElementById(`btn-${task}`);
          const statusSpan = document.getElementById(`status-${task}`);
          if (btn && statusSpan) {
            btn.classList.add('completed');
            statusSpan.innerText = 'Verified ✅';
          }
          completedCount++;
        }
      });

      const openBtn = document.getElementById('btn-open-now');
      const statusMsg = document.getElementById('statusMsg');

      // Unlocks ONLY when all 4 tasks are verified
      if (completedCount === tasks.length) {
        localStorage.setItem('all_tasks_completed', 'true');
        if (openBtn) openBtn.style.display = 'block';
        if (statusMsg) statusMsg.style.display = 'block';
      } else {
        localStorage.setItem('all_tasks_completed', 'false');
        if (openBtn) openBtn.style.display = 'none';
        if (statusMsg) statusMsg.style.display = 'none';
      }
    }

    function openBatch(e) {
      vibratePhone(50);
      if (localStorage.getItem('all_tasks_completed') !== 'true') {
        e.preventDefault();
        alert('Please complete all 4 social media tasks first!');
      }
    }

    function resetTaskProgress() {
      vibratePhone(30);
      tasks.forEach(task => {
        localStorage.removeItem(`task_${task}`);
        const btn = document.getElementById(`btn-${task}`);
        const statusSpan = document.getElementById(`status-${task}`);
        if (btn && statusSpan) {
          btn.classList.remove('completed');
          statusSpan.innerText = '➔';
        }
      });
      localStorage.setItem('all_tasks_completed', 'false');
      document.getElementById('btn-open-now').style.display = 'none';
      document.getElementById('statusMsg').style.display = 'none';
    }

    function vibratePhone(ms) {
      if ("vibrate" in navigator) {
        navigator.vibrate(ms);
      }
    }
  </script>

</body>
</html>
